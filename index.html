<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Broken Component Repair</title>
  <style>
    :root {
      --bg: #ffffff;
      --fg: #1d1d1f;
      --muted: #6b6b70;
      --line: #e4e4e8;
      --surface: #f7f7f9;
      --accent: #6911d4;
      --accent-fg: #ffffff;
      --ok: #1f7a4d;
      --warn: #8a5a12;
      --bad: #b02a2a;
      --radius: 8px;
      color-scheme: light;
      font-family: "Work Sans", Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
    }

    [data-theme="dark"] {
      --bg: #18181a;
      --fg: #f2f2f4;
      --muted: #9a9aa2;
      --line: #2f2f34;
      --surface: #212125;
      --accent: #b18cff;
      --accent-fg: #1a1a1d;
      --ok: #63c68f;
      --warn: #e0af5f;
      --bad: #ef7d7d;
      color-scheme: dark;
    }

    * { box-sizing: border-box; }

    /* A display rule on an element otherwise wins from the hidden attribute. */
    [hidden] { display: none !important; }

    body {
      margin: 0;
      padding: 16px;
      background: var(--bg);
      color: var(--fg);
      font-size: 13px;
      line-height: 1.5;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    button {
      font: inherit;
      font-weight: 600;
      border: 1px solid transparent;
      border-radius: var(--radius);
      padding: 8px 14px;
      min-height: 34px;
      cursor: pointer;
      background: var(--accent);
      color: var(--accent-fg);
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease, opacity 0.15s ease;
    }

    button.secondary { background: transparent; color: var(--fg); border-color: var(--line); }
    button:hover:not(:disabled) { opacity: 0.88; }
    button.secondary:hover:not(:disabled) { background: var(--surface); opacity: 1; }
    button:active:not(:disabled) { transform: scale(0.98); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    :where(button, select, input, [tabindex]):focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    select {
      font: inherit;
      font-size: 12px;
      color: var(--fg);
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 5px 6px;
      min-height: 30px;
    }

    /* One primary action. Everything else earns its place by being needed. */
    .toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    .toolbar select { margin-left: auto; }

    #scroll { flex: 1; min-height: 0; overflow: auto; }

    #summary { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
    #summary b { color: var(--fg); font-weight: 600; }

    #status { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
    #status[data-tone="error"] { color: var(--bad); }
    #status[data-tone="ok"] { color: var(--ok); }

    #results.list { border-top: 1px solid var(--line); }

    #lastRepair:not(:empty) {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      padding: 9px 10px;
      margin-bottom: 10px;
      font-size: 11px;
    }
    #lastRepair h2 { font-size: 11px; margin: 0 0 5px; letter-spacing: -0.01em; }
    #lastRepair .line { display: flex; gap: 6px; padding: 2px 0; }
    #lastRepair .line b { font-weight: 600; }
    #lastRepair .kept { color: var(--muted); }
    #lastRepair .lost { color: var(--bad); }

    .item { border-bottom: 1px solid var(--line); padding: 10px 2px; display: grid; gap: 5px; }
    .item-head { display: flex; align-items: center; gap: 8px; }
    .item-name {
      font-weight: 600;
      background: none;
      border: 0;
      padding: 0;
      color: var(--fg);
      cursor: pointer;
      text-align: left;
      min-height: 0;
      text-decoration: underline;
      text-decoration-color: var(--line);
      text-underline-offset: 3px;
    }
    .item-name:hover { text-decoration-color: var(--accent); opacity: 1; }
    .meta { font-size: 11px; color: var(--muted); }

    .info {
      background: none;
      border: 0;
      padding: 2px;
      min-height: 0;
      line-height: 0;
      border-radius: 999px;
      color: var(--muted);
      transition: color 0.15s ease;
    }
    .info:hover:not(:disabled) { color: var(--fg); opacity: 1; }
    .info[aria-expanded="true"] { color: var(--accent); }

    .details { display: grid; gap: 4px; }

    .badge {
      margin-left: auto;
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 10px;
      font-weight: 600;
      border: 1px solid currentColor;
      white-space: nowrap;
    }
    .badge.repairable { color: var(--ok); }
    .badge.ambiguous { color: var(--warn); }
    .badge.unresolved { color: var(--bad); }

    .choice { display: flex; align-items: center; gap: 6px; }
    .choice select { flex: 1; min-width: 0; }

    .variants { display: grid; gap: 4px; padding-left: 12px; border-left: 2px solid var(--line); }
    .warn { color: var(--warn); }

    .empty { color: var(--muted); font-size: 12px; max-width: 46ch; padding: 4px 0 8px; }

    .diag { margin-top: 12px; font-size: 11px; color: var(--muted); }
    .diag summary { cursor: pointer; }
    .diag dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 8px 0 0; }
    .diag dt { color: var(--muted); }
    .diag dd { margin: 0; color: var(--fg); }

    /* The repair action only exists once there is something to repair. */
    #actions { display: flex; border-top: 1px solid var(--line); padding-top: 10px; margin-top: 10px; }
    #actions button { flex: 1; }

    .spinner {
      width: 13px; height: 13px; border-radius: 50%;
      border: 2px solid var(--line); border-top-color: var(--accent);
      display: inline-block; vertical-align: -2px; margin-right: 6px;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <button id="scan" type="button">Scannen</button>
    <select id="scope" aria-label="Bereik van de scan">
      <option value="file">Hele bestand</option>
      <option value="page">Huidige pagina</option>
    </select>
  </div>

  <div id="scroll">
    <div id="summary" hidden></div>
    <div id="status" role="status" aria-live="polite" hidden></div>
    <div id="lastRepair"></div>
    <div id="results">
      <p class="empty">Nog niet gescand. Klik Scannen om de component-copies in dit bestand te controleren.</p>
    </div>

    <details class="diag">
      <summary>Diagnose</summary>
      <dl id="diagnostics">
        <dt>Nog niet gescand</dt><dd>&nbsp;</dd>
      </dl>
    </details>
  </div>

  <div id="actions" hidden>
    <button id="repair" type="button">Herstel selectie</button>
  </div>

  <script>
  const el = id => document.getElementById(id);

  const scanButton = el("scan");
  const repairButton = el("repair");
  const actionsBar = el("actions");
  const scopeSelect = el("scope");
  const summaryLine = el("summary");
  const statusLine = el("status");
  const resultsBox = el("results");
  const lastRepairBox = el("lastRepair");
  const diagnosticsList = el("diagnostics");

  /** shape id -> chosen library component key */
  const choices = new Map();
  function sameProps(a, b) {
    if (!a || !b) return false;
    const keys = Object.keys(b);
    return keys.length > 0 && keys.every(key => a[key] === b[key]);
  }
  let lastScan = null;

  function send(message) {
    window.parent.postMessage(message, "*");
  }

  function plural(count, one, many) {
    return `${count} ${count === 1 ? one : many}`;
  }

  // An empty status line is a hidden status line, so the panel does not reserve
  // space for the word "Gereed".
  function setStatus(text, tone = "", busy = false) {
    statusLine.dataset.tone = tone;
    statusLine.innerHTML = "";
    statusLine.hidden = !text;
    if (!text) return;
    if (busy) {
      const spinner = document.createElement("span");
      spinner.className = "spinner";
      statusLine.append(spinner);
    }
    statusLine.append(document.createTextNode(text));
  }

  function applyTheme(theme) {
    document.documentElement.dataset.theme = theme === "dark" ? "dark" : "light";
  }

  function label(match) {
    const library = match.isLocal ? "Lokale library" : match.libraryName;
    return `${library} · ${match.fullName}`;
  }

  const INFO_ICON =
    '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true" focusable="false">' +
    '<circle cx="8" cy="8" r="6.4" stroke="currentColor" stroke-width="1.2"/>' +
    '<path d="M8 7.2v4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>' +
    '<circle cx="8" cy="4.7" r="0.85" fill="currentColor"/></svg>';

  function reasonText(item) {
    return item.reason === "no-component"
      ? "Componentverwijzing niet meer leesbaar, daarom gezocht op laagnaam"
      : "Verwijst naar een component in een library die niet meer verbonden is";
  }

  function updateActions() {
    actionsBar.hidden = choices.size === 0;
    repairButton.textContent = `Herstel ${plural(choices.size, "component", "componenten")}`;
  }

  function buildItem(item) {
    const row = document.createElement("div");
    row.className = "item";

    const head = document.createElement("div");
    head.className = "item-head";

    const name = document.createElement("button");
    name.type = "button";
    name.className = "item-name";
    name.textContent = item.shapeName || "(unnamed)";
    name.title = "Selecteer deze shape op het canvas";
    name.addEventListener("click", () => send({ type: "select", id: item.id }));

    const badge = document.createElement("span");
    badge.className = `badge ${item.status}`;
    badge.textContent =
      item.status === "repairable" ? "match gevonden"
      : item.status === "ambiguous" ? `${item.matches.length} matches`
      : "geen match";

    // Where it sits and why it was matched on a name is background, not
    // something to read on every row. It waits behind the info toggle.
    const details = document.createElement("div");
    details.className = "details";
    details.id = `details-${item.id}`;
    details.hidden = true;

    const info = document.createElement("button");
    info.type = "button";
    info.className = "info";
    info.title = "Toon details";
    info.setAttribute("aria-label", "Toon details");
    info.setAttribute("aria-expanded", "false");
    info.setAttribute("aria-controls", details.id);
    info.innerHTML = INFO_ICON;
    info.addEventListener("click", () => {
      const open = details.hidden;
      details.hidden = !open;
      info.setAttribute("aria-expanded", String(open));
      info.title = open ? "Verberg details" : "Toon details";
      info.setAttribute("aria-label", info.title);
    });

    head.append(name, info, badge);

    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = `${item.pageName} · gezocht op "${item.lookupName}" · ${reasonText(item)}`;
    details.append(meta);

    row.append(head, details);

    if (item.matches.length === 0) {
      const hint = document.createElement("div");
      hint.className = "meta";
      hint.textContent = "Geen component met deze naam in de lokale of verbonden libraries.";
      details.append(hint);
      return row;
    }

    const choice = document.createElement("div");
    choice.className = "choice";

    const select = document.createElement("select");
    select.id = `choice-${item.id}`;

    const skip = document.createElement("option");
    skip.value = "";
    skip.textContent = "Niet aanraken";
    select.append(skip);

    for (const match of item.matches) {
      const option = document.createElement("option");
      option.value = match.key;
      option.textContent = label(match);
      select.append(option);
    }

    // Only an unambiguous match is preselected. A name that exists in more than
    // one library is always a human decision.
    if (item.matches.length === 1) {
      select.value = item.matches[0].key;
      choices.set(item.id, item.matches[0].key);
    }

    const variantBox = document.createElement("div");
    variantBox.className = "variants";

    // A container is one entry in the list above. Which member of it the copy
    // used cannot be read off a broken link, so it is picked here and swapped
    // to directly.
    function renderVariantPicker() {
      variantBox.innerHTML = "";

      const containerKey = select.value;
      const match = item.matches.find(candidate => candidate.key === containerKey);
      if (!match || !match.variants || match.variants.length < 2) return;

      const detected = item.variantProps;
      const guessed = detected
        ? match.variants.find(variant => sameProps(variant.props, detected))
        : null;

      const picker = document.createElement("select");
      picker.id = `variant-${item.id}`;

      for (const variant of match.variants) {
        const option = document.createElement("option");
        option.value = variant.key;
        option.textContent = variant.label;
        picker.append(option);
      }

      picker.value = guessed ? guessed.key : match.variants[0].key;
      choices.set(item.id, picker.value);

      picker.addEventListener("change", () => {
        choices.set(item.id, picker.value);
        warn.hidden = true;
      });

      const pickerLabel = document.createElement("label");
      pickerLabel.className = "meta";
      pickerLabel.htmlFor = picker.id;
      pickerLabel.textContent = "Variant";

      const row = document.createElement("div");
      row.className = "choice";
      row.append(pickerLabel, picker);

      const warn = document.createElement("div");
      warn.className = "meta warn";
      warn.textContent = `Welke variant deze copy gebruikte is niet af te leiden. Kies hem zelf, anders wordt het "${match.variants[0].label}".`;
      warn.hidden = !!guessed;

      variantBox.append(row, warn);
    }

    select.addEventListener("change", () => {
      if (select.value) choices.set(item.id, select.value);
      else choices.delete(item.id);
      renderVariantPicker();
      updateActions();
    });

    const selectLabel = document.createElement("label");
    selectLabel.className = "meta";
    selectLabel.htmlFor = select.id;
    selectLabel.textContent = "Koppel aan";

    choice.append(selectLabel, select);
    row.append(choice, variantBox);
    renderVariantPicker();
    return row;
  }

  // Nothing broken is one sentence, not a heading plus a paragraph plus a
  // button that repeats the one in the toolbar.
  function renderEmpty(scan) {
    const empty = document.createElement("p");
    empty.className = "empty";
    empty.textContent = scan.diagnostics.copyInstances === 0
      ? `Geen component-copies gevonden op ${plural(scan.diagnostics.pages, "pagina", "pagina's")}, ${plural(scan.diagnostics.shapes, "shape", "shapes")} bekeken. Klopt het bereik?`
      : `${plural(scan.diagnostics.copyInstances, "component-copy", "component-copies")} gecontroleerd, alles verwijst naar een bestaand component.`;
    resultsBox.append(empty);
  }

  // Only what changes a decision. The rest is for the case where the scan finds
  // nothing and you need to know why.
  function renderDiagnostics(diagnostics, scope) {
    const rows = [
      ["Scope", scope === "file" ? "Hele bestand" : "Huidige pagina"],
      ["Pagina's gescand", String(diagnostics.pages)],
      ["Shapes bekeken", String(diagnostics.shapes)],
      ["Component-copies", String(diagnostics.copyInstances)],
      ["Libraries", `${diagnostics.libraries} met ${plural(diagnostics.components, "component", "componenten")}`],
    ];

    const errors = diagnostics.errors || [];
    if (diagnostics.copyInstances === 0 || errors.length) {
      rows.push(
        ["Kinderen in een copy (overgeslagen)", String(diagnostics.nested ?? 0)],
        ["Main components op canvas", String(diagnostics.mainInstances)],
        ["Variant-containers", String(diagnostics.variants ?? 0)],
      );
    }
    if (errors.length) rows.push(["Overgeslagen door fouten", errors.join(" | ")]);

    diagnosticsList.innerHTML = "";
    for (const [term, value] of rows) {
      const dt = document.createElement("dt");
      dt.textContent = term;
      const dd = document.createElement("dd");
      dd.textContent = value;
      diagnosticsList.append(dt, dd);
    }
  }

  // "kapot" is the sum of the three others, so one line says what four tiles
  // said, and only when there is something to say.
  function renderSummary(counts) {
    if (counts.broken === 0) {
      summaryLine.hidden = true;
      summaryLine.textContent = "";
      return;
    }

    const parts = [];
    if (counts.repairable) parts.push(`${counts.repairable} te herstellen`);
    if (counts.ambiguous) parts.push(`${counts.ambiguous} keuze nodig`);
    if (counts.unresolved) parts.push(`${counts.unresolved} geen match`);

    summaryLine.hidden = false;
    summaryLine.innerHTML = "";
    const total = document.createElement("b");
    total.textContent = `${plural(counts.broken, "kapotte copy", "kapotte copies")}`;
    summaryLine.append(total);
    if (parts.length) summaryLine.append(document.createTextNode(`: ${parts.join(", ")}`));
  }

  function render(scan) {
    lastScan = scan;
    choices.clear();

    renderSummary(scan.counts);

    resultsBox.innerHTML = "";
    resultsBox.classList.toggle("list", scan.items.length > 0);
    if (scan.items.length === 0) renderEmpty(scan);
    else for (const item of scan.items) resultsBox.append(buildItem(item));

    renderDiagnostics(scan.diagnostics, scan.scope);
    updateActions();
  }

  const LABELS = {
    name: "naam",
    size: "grootte",
    x: "positie x",
    y: "positie y",
    rotation: "rotatie",
    flipX: "spiegeling x",
    flipY: "spiegeling y",
    hidden: "zichtbaarheid",
    blocked: "vergrendeling",
    proportionLock: "verhoudingsslot",
    constraintsHorizontal: "constraint horizontaal",
    constraintsVertical: "constraint verticaal",
  };

  function renderRepairDetails(details) {
    lastRepairBox.innerHTML = "";
    if (!details || details.length === 0) return;

    const title = document.createElement("h2");
    title.textContent = "Behouden bij de laatste reparatie";
    lastRepairBox.append(title);

    for (const detail of details) {
      const line = document.createElement("div");
      line.className = "line";

      const name = document.createElement("b");
      name.textContent = detail.name || "(naamloos)";

      const kept = document.createElement("span");
      kept.className = detail.failed && detail.failed.length ? "lost" : "kept";

      const parts = [];
      if (detail.variant && detail.variant.length) parts.push("variant " + detail.variant.join(", "));
      const props = (detail.restored || []).map(key => LABELS[key] || key);
      if (props.length) parts.push(props.join(", "));
      const text = detail.text || [];
      if (text.length) {
        parts.push("tekst in " + (text.length > 3
          ? `${text.slice(0, 3).join(", ")} +${text.length - 3}`
          : text.join(", ")));
      }
      if (detail.failed && detail.failed.length) parts.push("mislukt: " + detail.failed.join(" | "));

      kept.textContent = parts.length ? parts.join(" · ") : "niets hoefde hersteld te worden";

      line.append(name, kept);
      lastRepairBox.append(line);
    }
  }

  function startScan() {
    scanButton.disabled = true;
    actionsBar.hidden = true;
    lastRepairBox.innerHTML = "";
    setStatus("Scannen…", "", true);
    send({ type: "scan", scope: scopeSelect.value });
  }

  scanButton.addEventListener("click", startScan);

  repairButton.addEventListener("click", () => {
    if (choices.size === 0) return;
    scanButton.disabled = true;
    actionsBar.hidden = true;
    setStatus(`${plural(choices.size, "component", "componenten")} herstellen…`, "", true);
    send({
      type: "repair",
      scope: (lastScan && lastScan.scope) || scopeSelect.value,
      choices: Object.fromEntries(choices),
    });
  });

  // Changing the scope is the request. Asking for a second click to honour it
  // is the panel making the user press its own button.
  scopeSelect.addEventListener("change", startScan);

  let connected = false;

  function describeProbe(probe, notes) {
    const rows = [
      ["Sandbox", "verbonden"],
      ["Huidige pagina", probe.currentPage ? "ja" : "nee"],
      ["Bestand leesbaar", probe.currentFile ? `ja, ${plural(probe.pages, "pagina", "pagina's")}` : "nee"],
      ["findShapes()", probe.findShapes ? "werkt" : "faalt"],
      ["isComponentCopyInstance()", probe.isComponentCopyInstance ? "aanwezig" : "niet gevonden"],
      ["swapComponent()", probe.swapComponent ? "aanwezig" : "niet gevonden"],
      ["Undo-blokken", probe.history ? "aanwezig" : "niet gevonden"],
      ["Lokale componenten", String(probe.localComponents)],
      ["Verbonden libraries", String(probe.connectedLibraries)],
    ];
    if (notes && notes.length) rows.push(["Fouten", notes.join(" | ")]);

    diagnosticsList.innerHTML = "";
    for (const [term, value] of rows) {
      const dt = document.createElement("dt");
      dt.textContent = term;
      const dd = document.createElement("dd");
      dd.textContent = value;
      diagnosticsList.append(dt, dd);
    }
  }

  window.addEventListener("message", event => {
    const message = event.data;
    if (!message || typeof message !== "object" || !("type" in message)) return;
    connected = true;

    switch (message.type) {
      case "hello":
        applyTheme(message.theme);
        describeProbe(message.probe, message.notes);
        // Connected is the normal case. The Scan button says the rest.
        setStatus("");
        return;

      case "theme":
        applyTheme(message.theme);
        return;

      case "scan-result":
        scanButton.disabled = false;
        render(message);
        // The summary line and the empty state already say what the scan
        // found, so a second sentence here would only repeat them.
        setStatus("");
        return;

      case "repair-result": {
        scanButton.disabled = false;
        render(message.scan);
        renderRepairDetails(message.details);
        const tone = message.failed > 0 ? "error" : "ok";
        const detail = message.failures.length ? ` Eerste fout: ${message.failures[0].message}` : "";
        setStatus(`${message.fixed} hersteld, ${message.failed} mislukt.${detail}`, tone);
        return;
      }

      case "error":
        scanButton.disabled = false;
        setStatus(`Fout: ${message.message}`, "error");
        return;
    }
  });

  applyTheme(new URLSearchParams(window.location.search).get("theme") || "light");
  send({ type: "ready" });
  setStatus("Verbinden met Penpot…", "", true);

  // If plugin.js never answers, the sandbox failed to load. Say so instead of
  // leaving a panel that looks fine but does nothing.
  setTimeout(() => {
    if (connected) return;
    setStatus("Geen verbinding met de Penpot sandbox. plugin.js is niet geladen. In Chrome en Edge komt dit meestal doordat de browser localhost blokkeert: herstart serve.py, of gebruik Firefox.", "error");
    scanButton.disabled = true;
  }, 2500);
  </script>
</body>
</html>
